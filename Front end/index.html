<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Spam SMS Indonesia</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .title-icon {
            font-size: 3rem;
            color: #4e73df;
        }

        .btn-custom {
            background: linear-gradient(135deg, #4e73df, #224abe);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.02);
        }

        textarea {
            border-radius: 12px !important;
        }

        .footer-text {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .result-box {
            border-radius: 15px;
            padding: 15px;
            font-weight: bold;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card p-4">
                <div class="text-center mb-3">
                    <i class="bi bi-shield-check title-icon"></i>
                    <h2 class="mt-2">Deteksi Spam SMS</h2>
                    <p class="text-muted">
                        Cek apakah pesan SMS termasuk spam atau bukan.
                    </p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-chat-left-text"></i>
                            Isi SMS
                        </label>

                        <textarea
                            class="form-control"
                            name="sms_text"
                            rows="5"
                            placeholder="Contoh: Selamat! Anda memenangkan hadiah..."
                            required>{{ text_input }}</textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom text-white">
                            <i class="bi bi-search"></i>
                            Analisis SMS
                        </button>
                    </div>
                </form>

                {% if prediksi %}
                <div class="result-box alert alert-info mt-4 text-center">
                    <i class="bi bi-info-circle-fill"></i>
                    <h4 class="mt-2">{{ prediksi }}</h4>
                </div>
                {% endif %}
            </div>

            <p class="footer-text">
                © 2026 Kelompok 1 | Sistem Deteksi Spam SMS Indonesia
            </p>

        </div>
    </div>
</div>

</body>
</html>
